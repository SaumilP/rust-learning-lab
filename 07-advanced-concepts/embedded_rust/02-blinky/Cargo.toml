[package]
name = "blinky"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "0.2"
embedded-hal = "0.2"

# STM32F4 HAL (comment out if using different board)
stm32f4xx-hal = { version = "0.16", features = ["stm32f401"] }

# For RP2040 (uncomment if using Pico)
# rp-pico = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
