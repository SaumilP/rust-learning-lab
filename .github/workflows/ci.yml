name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  learning-modules:
    name: Module ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - 01-core-fundamentals
          - 02-standard-library
          - 03-tooling-and-quality
          - 04-simple-programs
          - 05-cli-and-console-games
          - 06-intermediate-rust
          - 08-design-patterns

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate module
        working-directory: ${{ matrix.module }}
        run: make check

      - name: Remove generated documentation and binaries
        if: always()
        working-directory: ${{ matrix.module }}
        run: make clean

  cargo-packages:
    name: Cargo ${{ matrix.path }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - 00-setup-and-basics/hello_world
          - 00-setup-and-basics/variables_and_mutability
          - 00-setup-and-basics/data_types
          - 00-setup-and-basics/control_flow
          - 01-core-fundamentals/ownership
          - 01-core-fundamentals/borrowing
          - 01-core-fundamentals/lifetimes
          - 09-mini-projects

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        working-directory: ${{ matrix.path }}
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: ${{ matrix.path }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: ${{ matrix.path }}
        run: cargo test --all-targets
